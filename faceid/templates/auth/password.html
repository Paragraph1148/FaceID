{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 mb-3">Choose a new password</h1>
  {% if current_user.must_change_password %}
  <p class="text-body-secondary">You are using a temporary password. Choose your own before continuing.</p>
  {% endif %}
  <form method="post" class="card card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="new_password">New password (at least 8 characters)</label>
    <input class="form-control mb-3" id="new_password" name="new_password" type="password" required minlength="8">
    <label class="form-label" for="confirm_password">Repeat new password</label>
    <input class="form-control mb-3" id="confirm_password" name="confirm_password" type="password" required>
    <button class="btn btn-primary">Save password</button>
  </form>
</div></div>
{% endblock %}
