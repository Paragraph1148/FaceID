<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FaceID{% endblock %} · FaceID</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('auth.index') }}">FaceID</a>
    {% if current_user.is_authenticated %}
    <div class="navbar-nav me-auto">{% block nav %}{% endblock %}</div>
    <span class="navbar-text me-3">{{ current_user.name }} · {{ current_user.role|capitalize }}</span>
    <form method="post" action="{{ url_for('auth.logout') }}" class="m-0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-outline-light btn-sm">Log out</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="alert alert-{{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
